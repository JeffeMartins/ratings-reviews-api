name: ratings-reviews
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ratings
      POSTGRES_USER: ratings
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.ps1 first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratings -d ratings"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 512m
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    mem_limit: 160m
    restart: unless-stopped
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ratings
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup.ps1 first}
      REDIS_HOST: redis
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/setup.ps1 first}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:?Run scripts/setup.ps1 first}
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
volumes:
  postgres-data:
